<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIDR + VLSM IP Calculator support IPv4 and IPv6</title>
<style>
body{font-size:18px;font-family:system-ui,Arial;max-width:900px;margin:30px auto;padding:20px;background:#0f172a;color:#e2e8f0}
h2{color:#38bdf8;margin-bottom:5px}
input,button,textarea{padding:10px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;width:100%;box-sizing:border-box;margin:5px 0;font-family:inherit}
button{background:#2563eb;border:0;cursor:pointer;font-weight:600}
button:hover{background:#1d4ed8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:15px;margin-top:15px}
label{font-size:13px;color:#94a3b8}
small{color:#94a3b8}
.error{color:#f87171}
.copy-row{display:flex;gap:8px}
.copy-row input{flex:1}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border:1px solid #334155;padding:6px;text-align:left}
th{background:#1e293b;color:#38bdf8}
textarea{min-height:80px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body id="denny.wordpress.com">

<h2>CIDR + VLSM Calculator - Offline</h2>
<small>Edit any field, others auto update. VLSM works for IPv4 only.</small>

<div class="grid">
  <div>
    <label>IP Address</label>
    <input id="ip" placeholder="192.168.1.0">
  </div>
  <div>
    <label>CIDR / Prefix</label>
    <input id="cidr" type="number" min="0" max="128">
  </div>
  <div>
    <label>Netmask</label>
    <input id="netmask" placeholder="255.255.255.0">
  </div>
  <div>
    <label>Total Hosts</label>
    <input id="hosts" type="number" min="1">
  </div>
</div>

<button onclick="copyLink()">Copy Share Link</button>
<div class="copy-row">
  <input id="shareLink" readonly>
</div>

<div id="out"></div>

<h3 style="margin-top:30px">VLSM Subnet Calculator</h3>
<label>Required hosts per subnet, one per line:</label>
<textarea id="vlsmInput" placeholder="50&#10;20&#10;10&#10;2"></textarea>
<button onclick="runVLSM()">Calculate VLSM</button>
<div id="vlsmOut"></div>

<script>
let updating = false;

function init(){
  const params = new URLSearchParams(location.search);
  let cidrParam = params.get('cidr');

  if(cidrParam){
    loadFromCIDR(cidrParam);
  } else {
    let ver = Math.random() > 0.5? 4 : 6;
    if(ver === 4){
      let ip = `${rand(10,223)}.${rand(0,255)}.${rand(0,255)}.${rand(0,255)}`;
      let p = rand(20,28);
      loadFromCIDR(ip+'/'+p);
    } else {
      let ip = '2001:db8:'+rand(0,65535).toString(16)+'::';
      let p = rand(56,64);
      loadFromCIDR(ip+'/'+p);
    }
  }

  document.getElementById('ip').oninput = () => onChange('ip');
  document.getElementById('cidr').oninput = () => onChange('cidr');
  document.getElementById('netmask').oninput = () => onChange('netmask');
  document.getElementById('hosts').oninput = () => onChange('hosts');
}

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function loadFromCIDR(str){
  if(!str.includes('/')) return;
  let [ip,p] = str.split('/');
  document.getElementById('ip').value = ip;
  document.getElementById('cidr').value = p;
  updateAll(ip, parseInt(p));
}

function onChange(field){
  if(updating) return;
  updating = true;

  let ip = document.getElementById('ip').value.trim();
  let p = parseInt(document.getElementById('cidr').value);
  let mask = document.getElementById('netmask').value.trim();
  let hosts = parseInt(document.getElementById('hosts').value);

  if(field === 'cidr' &&!isNaN(p)) updateAll(ip,p);
  else if(field === 'netmask' && mask) {
    let p2 = maskToCIDR(mask);
    if(p2!== null){ document.getElementById('cidr').value = p2; updateAll(ip,p2) }
  }
  else if(field === 'hosts' &&!isNaN(hosts) && ip.includes('.')){
    let p2 = 32 - Math.ceil(Math.log2(hosts+2));
    if(p2>=0 && p2<=32){ document.getElementById('cidr').value = p2; updateAll(ip,p2) }
  }
  else if(field === 'ip'){
    let p2 = parseInt(document.getElementById('cidr').value) || (ip.includes(':')?64:24);
    updateAll(ip,p2);
  }

  updating = false;
}

function updateAll(ip,p){
  if(!ip || isNaN(p)) return;
  if(ip.includes(':')) calcIPv6(ip,p);
  else calcIPv4(ip,p);
  updateShareLink();
}

function calcIPv4(ip,p){
  let parts = ip.split('.').map(Number);
  if(parts.length!=4 || parts.some(n=>n<0||n>255||isNaN(n))){showErr('Invalid IPv4');return}
  if(p<0||p>32){showErr('Prefix must be 0-32');return}

  let ipInt = parts[0]*16777216 + parts[1]*65536 + parts[2]*256 + parts[3];
  let mask = p===0? 0 : (0xffffffff << (32-p)) >>> 0;
  let network = ipInt & mask;
  let broadcast = network | (~mask >>> 0);
  let hosts = p>=31? (p===31?2:1) : Math.pow(2,32-p)-2;
  let first = p>=31? network : network+1;
  let last = p>=31? broadcast : broadcast-1;

  function toIP(n){return [(n/16777216)&255,(n/65536)&255,(n/256)&255,n&255].join('.')}

  document.getElementById('netmask').value = toIP(mask);
  document.getElementById('hosts').value = hosts;

  document.getElementById('out').innerHTML = `
  <div class="result">
    <div class="grid">
      <div><b>Network</b><br>${toIP(network)}/${p}</div>
      <div><b>Broadcast</b><br>${toIP(broadcast)}</div>
      <div><b>Usable Range</b><br>${toIP(first)} - ${toIP(last)}</div>
      <div><b>Wildcard</b><br>${toIP(~mask>>>0)}</div>
    </div>
  </div>`;
}

function calcIPv6(ip,p){
  try{
    let full = expandIPv6(ip);
    let bin = ipv6ToBin(full);
    let netBin = bin.slice(0,p) + '0'.repeat(128-p);
    let firstBin = bin.slice(0,p) + '0'.repeat(128-p);
    let lastBin = bin.slice(0,p) + '1'.repeat(128-p);

    let network = binToIPv6(netBin);
    let first = binToIPv6(firstBin);
    let last = binToIPv6(lastBin);
    let hosts = p>=64? '2^'+(128-p) : (BigInt(2)**BigInt(128-p)).toString();

    document.getElementById('netmask').value = cidrToMaskIPv6(p);
    document.getElementById('hosts').value = hosts.includes('^')? '' : hosts;

    document.getElementById('out').innerHTML = `
    <div class="result">
      <div class="grid">
        <div><b>Network</b><br>${network}/${p}</div>
        <div><b>Usable Range</b><br>${first} - ${last}</div>
        <div style="grid-column:1/3"><b>Total Addresses</b><br>${hosts}</div>
      </div>
    </div>`;
  }catch(e){showErr('Invalid IPv6')}
}

function maskToCIDR(mask){
  let parts = mask.split('.').map(Number);
  if(parts.length!=4) return null;
  let bin = parts.map(n=>n.toString(2).padStart(8,'0')).join('');
  let p = bin.indexOf('0');
  return p===-1?32:p;
}

function cidrToMaskIPv6(p){
  let bin = '1'.repeat(p)+'0'.repeat(128-p);
  let parts = [];
  for(let i=0;i<128;i+=16) parts.push(parseInt(bin.slice(i,i+16),2).toString(16));
  return parts.join(':');
}

function expandIPv6(ip){
  if(ip==='::') return '0000:0000:0000:0000:0000:0000:0000:0000';
  let parts = ip.split('::');
  let left = parts[0]?parts[0].split(':'):[];
  let right = parts[1]?parts[1].split(':'):[];
  let missing = 8 - left.length - right.length;
  let zeros = Array(missing).fill('0000');
  return [...left,...zeros,...right].map(h=>h.padStart(4,'0')).join(':');
}

function ipv6ToBin(ip){
  return ip.split(':').map(h=>parseInt(h,16).toString(2).padStart(16,'0')).join('');
}

function binToIPv6(bin){
  let parts = [];
  for(let i=0;i<128;i+=16) parts.push(parseInt(bin.slice(i,i+16),2).toString(16));
  return parts.join(':').replace(/(^|:)0(:0)+(:|$)/, '::').replace(/:{3,}/, '::');
}

function updateShareLink(){
  let ip = document.getElementById('ip').value;
  let p = document.getElementById('cidr').value;
  let url = location.origin + location.pathname + '?cidr=' + encodeURIComponent(ip+'/'+p);
  document.getElementById('shareLink').value = url;
}

function copyLink(){
  let link = document.getElementById('shareLink');
  link.select();
  document.execCommand('copy');
  alert('Link copied!');
}

function showErr(msg){
  document.getElementById('out').innerHTML = `<div class="error">${msg}</div>`;
}

// VLSM Logic
function runVLSM(){
  let baseIP = document.getElementById('ip').value.trim();
  let baseCIDR = parseInt(document.getElementById('cidr').value);
  let hostsList = document.getElementById('vlsmInput').value
   .split('\n')
   .map(x=>parseInt(x.trim()))
   .filter(x=>!isNaN(x) && x>0)
   .sort((a,b)=>b-a);

  if(!baseIP.includes('.')) return document.getElementById('vlsmOut').innerHTML = '<div class="error">VLSM only supports IPv4</div>';
  if(hostsList.length===0) return document.getElementById('vlsmOut').innerHTML = '<div class="error">Enter at least 1 host requirement</div>';

  let parts = baseIP.split('.').map(Number);
  let baseInt = parts[0]*16777216 + parts[1]*65536 + parts[2]*256 + parts[3];
  let baseMask = baseCIDR===0? 0 : (0xffffffff << (32-baseCIDR)) >>> 0;
  let baseNetwork = baseInt & baseMask;
  let baseBroadcast = baseNetwork | (~baseMask >>> 0);

  let current = baseNetwork;
  let rows = [];

  function toIP(n){return [(n/16777216)&255,(n/65536)&255,(n/256)&255,n&255].join('.')}

  for(let req of hostsList){
    let needed = req + 2; // network + broadcast
    let bits = Math.ceil(Math.log2(needed));
    let prefix = 32 - bits;
    let blockSize = Math.pow(2, bits);

    if(current + blockSize - 1 > baseBroadcast){
      rows.push(`<tr><td colspan="6" class="error">Not enough space for ${req} hosts</td></tr>`);
      break;
    }

    let net = current;
    let bc = current + blockSize - 1;
    let first = net + 1;
    let last = bc - 1;
    let usable = prefix>=31? (prefix===31?2:1) : blockSize - 2;

    rows.push(`<tr>
      <td>${req}</td>
      <td>/${prefix}</td>
      <td>${toIP(net)}</td>
      <td>${toIP(first)} - ${toIP(last)}</td>
      <td>${toIP(bc)}</td>
      <td>${usable}</td>
    </tr>`);

    current += blockSize;
  }

  document.getElementById('vlsmOut').innerHTML = `
  <div class="result">
    <table>
      <tr><th>Required Hosts</th><th>Subnet</th><th>Network</th><th>Usable Range</th><th>Broadcast</th><th>Usable IPs</th></tr>
      ${rows.join('')}
    </table>
  </div>`;
}

init();
</script>
</body>
</html>
