<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIDR Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:20px auto;
    padding:20px;
}
h2{
    margin-top:0;
}
table{
    width:100%;
    border-collapse:collapse;
}
td{
    padding:6px;
}
input{
    width:100%;
    padding:8px;
    box-sizing:border-box;
}
button{
    padding:8px 16px;
    margin-right:8px;
}
pre{
    background:#f5f5f5;
    padding:15px;
    overflow:auto;
}
</style>
</head>
<body>

<h2>IPv4 / IPv6 CIDR Calculator</h2>

<table>
<tr>
<td width="140">IP Address</td>
<td><input id="ip"></td>
</tr>

<tr>
<td>CIDR</td>
<td><input id="cidr" type="number"></td>
</tr>

<tr>
<td>Netmask</td>
<td><input id="netmask"></td>
</tr>

<tr>
<td>Total Hosts</td>
<td><input id="hosts"></td>
</tr>
</table>

<p>
<button onclick="copyLink()">Copy Link</button>
<button onclick="randomNetwork()">Random</button>
</p>

<pre id="result"></pre>

<script>

const ipInput = document.getElementById("ip");
const cidrInput = document.getElementById("cidr");
const maskInput = document.getElementById("netmask");
const hostsInput = document.getElementById("hosts");
const result = document.getElementById("result");

function ipv4ToInt(ip){
    return ip.split('.')
        .reduce((a,v)=>((a<<8)>>>0)+(+v),0)>>>0;
}

function intToIpv4(n){
    return [
        (n>>>24)&255,
        (n>>>16)&255,
        (n>>>8)&255,
        n&255
    ].join('.');
}

function cidrToMask(cidr){
    if(cidr===0) return "0.0.0.0";

    let mask=((0xffffffff<<(32-cidr))>>>0);

    return intToIpv4(mask);
}

function maskToCIDR(mask){
    let n=ipv4ToInt(mask);
    let c=0;

    for(let i=31;i>=0;i--){
        if((n&(1<<i))!==0) c++;
        else break;
    }

    return c;
}

function randomNetwork(){

    ipInput.value=
        "10."+
        Math.floor(Math.random()*256)+"."+
        Math.floor(Math.random()*256)+".0";

    cidrInput.value=
        8+Math.floor(Math.random()*23);

    calculate();
}

function expandIPv6(ip){

    let parts=ip.split("::");

    let left=parts[0] ? parts[0].split(":") : [];
    let right=parts[1] ? parts[1].split(":") : [];

    let missing=8-(left.length+right.length);

    return [
        ...left,
        ...Array(missing).fill("0"),
        ...right
    ].map(v=>v.padStart(4,"0"));
}

function ipv6ToBigInt(ip){

    let hex=expandIPv6(ip).join("");

    return BigInt("0x"+hex);
}

function bigIntToIPv6(n){

    let hex=n.toString(16).padStart(32,"0");

    let groups=[];

    for(let i=0;i<32;i+=4)
        groups.push(hex.slice(i,i+4));

    return groups.join(":");
}

function calculate(){

    let ip=ipInput.value.trim();

    if(!ip) return;

    if(ip.includes(":")){
        calculateIPv6();
    }else{
        calculateIPv4();
    }
}

function calculateIPv4(){

    let ip=ipInput.value.trim();
    let cidr=parseInt(cidrInput.value);

    if(isNaN(cidr) || cidr<0 || cidr>32)
        return;

    maskInput.value=cidrToMask(cidr);

    let hostCount=Math.pow(2,32-cidr);

    hostsInput.value=hostCount;

    let ipInt=ipv4ToInt(ip);

    let mask=cidr===0
        ? 0
        : ((0xffffffff<<(32-cidr))>>>0);

    let network=ipInt & mask;

    let broadcast=network | (~mask>>>0);

    let first=cidr>=31
        ? network
        : network+1;

    let last=cidr>=31
        ? broadcast
        : broadcast-1;

    result.textContent=
`Version      : IPv4
CIDR         : ${ip}/${cidr}
Network      : ${intToIpv4(network)}
Broadcast    : ${intToIpv4(broadcast)}
First Host   : ${intToIpv4(first)}
Last Host    : ${intToIpv4(last)}
Addresses    : ${hostCount}
Usable Hosts : ${cidr>=31 ? hostCount : Math.max(hostCount-2,0)}
`;
}

function calculateIPv6(){

    let ip=ipInput.value.trim();
    let cidr=parseInt(cidrInput.value);

    maskInput.value="N/A";

    let ipBig=ipv6ToBigInt(ip);

    let total=
        1n<<(128n-BigInt(cidr));

    hostsInput.value=total.toString();

    let mask=
        cidr===0
        ? 0n
        : ((1n<<128n)-1n) ^
          ((1n<<(128n-BigInt(cidr)))-1n);

    let network=ipBig & mask;

    let last=network+total-1n;

    result.textContent=
`Version      : IPv6
CIDR         : ${ip}/${cidr}
Network      : ${bigIntToIPv6(network)}
Last Address : ${bigIntToIPv6(last)}
Addresses    : ${total}
`;
}

cidrInput.addEventListener("input",calculate);

ipInput.addEventListener("input",calculate);

maskInput.addEventListener("change",()=>{

    let ip=ipInput.value.trim();

    if(ip.includes(":"))
        return;

    let cidr=maskToCIDR(maskInput.value.trim());

    cidrInput.value=cidr;

    calculate();
});

hostsInput.addEventListener("change",()=>{

    let ip=ipInput.value.trim();

    if(ip.includes(":"))
        return;

    let hosts=parseInt(hostsInput.value);

    if(!hosts || hosts<1)
        return;

    let cidr=
        32-Math.round(Math.log2(hosts));

    if(cidr<0) cidr=0;
    if(cidr>32) cidr=32;

    cidrInput.value=cidr;

    calculate();
});

async function copyLink(){

    let url=
        location.origin+
        location.pathname+
        "?cidr="+
        encodeURIComponent(
            ipInput.value+
            "/"+
            cidrInput.value
        );

    try{
        await navigator.clipboard.writeText(url);
        alert("Link copied");
    }catch(e){
        prompt("Copy:",url);
    }
}

(function(){

    let p=new URLSearchParams(location.search);

    let cidrParam=p.get("cidr");

    if(cidrParam){

        let parts=cidrParam.split("/");

        ipInput.value=parts[0];
        cidrInput.value=parts[1];

        calculate();

    }else{

        randomNetwork();
    }

})();

</script>

</body>
</html>
