<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IPv4 / IPv6 CIDR Calculator</title>
<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:20px auto;
    padding:20px;
}
input{
    width:100%;
    padding:10px;
    font-size:16px;
}
button{
    margin-top:10px;
    padding:10px 20px;
}
pre{
    background:#f4f4f4;
    padding:15px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>IPv4 / IPv6 CIDR Calculator</h2>

<input id="cidr" placeholder="192.168.1.10/24 or 2001:db8::1/64">
<button onclick="calc()">Calculate</button>

<pre id="out"></pre>

<script>

function ipv4ToInt(ip){
    return ip.split('.')
        .reduce((a,v)=>((a<<8)>>>0)+parseInt(v,10),0)>>>0;
}

function intToIpv4(n){
    return [
        (n>>>24)&255,
        (n>>>16)&255,
        (n>>>8)&255,
        n&255
    ].join('.');
}

function expandIPv6(ip){
    let parts = ip.split("::");

    let left = parts[0] ? parts[0].split(":") : [];
    let right = parts[1] ? parts[1].split(":") : [];

    let missing = 8 - (left.length + right.length);

    let groups = [
        ...left,
        ...Array(missing).fill("0"),
        ...right
    ];

    return groups.map(x => x.padStart(4,'0'));
}

function ipv6ToBigInt(ip){
    let groups = expandIPv6(ip);
    let hex = groups.join('');
    return BigInt('0x'+hex);
}

function bigIntToIPv6(n){
    let hex = n.toString(16).padStart(32,'0');
    let groups = [];

    for(let i=0;i<32;i+=4)
        groups.push(hex.slice(i,i+4));

    return groups.join(':')
        .replace(/\b0{1,3}/g,'')
        .replace(/(^|:)0(:0)+(:|$)/,'::');
}

function calcIPv4(ip,prefix){

    let ipInt = ipv4ToInt(ip);

    let mask =
        prefix === 0
        ? 0
        : ((0xffffffff << (32-prefix)) >>> 0);

    let network = ipInt & mask;
    let broadcast = network | (~mask >>> 0);

    let hosts = Math.pow(2,32-prefix);

    let usable =
        prefix >= 31
        ? hosts
        : Math.max(hosts-2,0);

    let first =
        prefix >= 31
        ? network
        : network + 1;

    let last =
        prefix >= 31
        ? broadcast
        : broadcast - 1;

    return `
Version      : IPv4
CIDR         : ${ip}/${prefix}
Network      : ${intToIpv4(network)}
Broadcast    : ${intToIpv4(broadcast)}
First Host   : ${intToIpv4(first)}
Last Host    : ${intToIpv4(last)}
Addresses    : ${hosts}
Usable Hosts : ${usable}
`;
}

function calcIPv6(ip,prefix){

    let ipBig = ipv6ToBigInt(ip);

    let bits = 128n;

    let mask =
        prefix === 0
        ? 0n
        : ((1n<<bits)-1n) ^
          ((1n<<(bits-BigInt(prefix)))-1n);

    let network = ipBig & mask;

    let total =
        1n << (128n-BigInt(prefix));

    let last =
        network + total - 1n;

    return `
Version      : IPv6
CIDR         : ${ip}/${prefix}
Network      : ${bigIntToIPv6(network)}
Last Address : ${bigIntToIPv6(last)}
Addresses    : ${total.toString()}
`;
}

function calc(){

    let value = document.getElementById("cidr").value.trim();

    try{

        let [ip,prefixStr] = value.split('/');

        if(!ip || prefixStr===undefined)
            throw "Invalid CIDR";

        let prefix = parseInt(prefixStr,10);

        let result;

        if(ip.includes(':')){

            if(prefix<0 || prefix>128)
                throw "Invalid IPv6 prefix";

            result = calcIPv6(ip,prefix);

        }else{

            if(prefix<0 || prefix>32)
                throw "Invalid IPv4 prefix";

            result = calcIPv4(ip,prefix);
        }

        document.getElementById("out").textContent = result;

    }catch(e){
        document.getElementById("out").textContent =
            "Error: " + e;
    }
}

</script>

</body>
</html>
