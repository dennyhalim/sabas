</head>

<input id="msg" placeholder="Ketik Enter" style="width:70%">
<button onclick="sendMsg()">Send</button>

<button onclick="file.click()">📁 File</button>

<script>
// === SETTING ===
const ABLY_API_KEY = ''; // Kosongin = skip Ably, langsung PeerJS
const params = new URLSearchParams(location.search);
const room = params.get('room') || 'default';
document.getElementById('roomName').textContent = room;

const log = t => {
  document.getElementById('log').innerHTML += t+'<br>';
  document.getElementById('log').scrollTop = 9999;
};
const setStatus = t => document.getElementById('status').innerHTML = t;

let pc, dc, localStream;
let signaling = null;
let ablyChannel = null;
let peer = null;
let conn = null;

const config = {iceServers:[{urls:'stun:stun.l.google.com:19302'}]};

// === BOOT: Cek key dulu ===
(async () => {
  if(ABLY_API_KEY && ABLY_API_KEY.trim() !== '') {
    const ok = await initAbly();
    if(!ok) await initPeerJS();
  } else {
    log('<span class="warn">⚠ ABLY_API_KEY kosong, skip ke PeerJS</span>');
    await initPeerJS();
  }
})();

// === ABLY ===
async function initAbly() {
  try {
    setStatus('<span class="warn">Coba Ably...</span>');
    const ably = new Ably.Realtime(ABLY_API_KEY);
    await ably.connection.once('connected');

    ablyChannel = ably.channels.get(room);
    await ablyChannel.subscribe('signal', msg => handleSignal(msg.data));

    signaling = 'ably';
    setStatus('<span class="ok">✓ Ably connected</span>');
    log('<span class="ok">Signaling: Ably</span>');
    startWebRTC(true);
    return true;
  } catch(e) {
    log('<span class="err">✗ Ably error: '+e.message+'</span>');
    return false;
  }
}
